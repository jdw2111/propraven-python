[project]
name = "propraven"
version = "0.2.0"
description = "Official Python SDK for the PropRaven property-intelligence API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PropRaven", email = "support@propraven.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.23,<1"]
keywords = ["propraven", "real estate", "parcels", "property data", "api", "sdk"]
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://propraven.com/developers"
Documentation = "https://propraven.com/docs/v1"
Repository = "https://github.com/jdw2111/propraven-python"
Changelog = "https://github.com/jdw2111/propraven-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propraven"]
# Metadata 2.4 (PEP 639 license expressions) is the newest version PyPI is known to accept.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/src",
  "/tests",
  "/scripts",
  "/openapi.json",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["src/propraven/types/__init__.py", "src/propraven/resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["propraven"]
