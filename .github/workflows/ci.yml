name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e . pytest pytest-asyncio

      - name: Generated code is up to date
        run: python scripts/generate.py --check

      - name: Tests
        run: python -m pytest -q

  lint-build:
    name: lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install ruff build twine

      - name: Ruff
        run: ruff check src tests scripts

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Import the built wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/python -c "import propraven; c = propraven.PropRaven(api_key='pz_x'); print(propraven.__version__, c.parcels)"
